name: Build and Release BookNote

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="$(node -p "require('./package.json').version")"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version $VERSION"

      - name: Validate manifest version
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const expected = process.env.VERSION;
          if (manifest.version !== expected) {
            console.error(`manifest version ${manifest.version} != ${expected}`);
            process.exit(1);
          }
          NODE
        env:
          VERSION: ${{ steps.version.outputs.version }}

      - name: JavaScript syntax checks
        shell: bash
        run: |
          set -e
          find . -type f -name '*.js' -not -path './node_modules/*' -print0 |
            xargs -0 -r -n1 node --check

      - name: Package XPI
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          rm -f "dist/BookNote-Offline-v${VERSION}.xpi"
          zip -qr "dist/BookNote-Offline-v${VERSION}.xpi" . \
            -x '.git/*' '.github/*' 'dist/*' '*.DS_Store'
          unzip -t "dist/BookNote-Offline-v${VERSION}.xpi"
          sha256sum "dist/BookNote-Offline-v${VERSION}.xpi" | tee "dist/BookNote-Offline-v${VERSION}.xpi.sha256"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: BookNote Offline v${{ steps.version.outputs.version }}
          generate_release_notes: true
          files: |
            dist/BookNote-Offline-v${{ steps.version.outputs.version }}.xpi
            dist/BookNote-Offline-v${{ steps.version.outputs.version }}.xpi.sha256

      - name: Update Firefox update manifest
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'PY'
          import json, os
          version = os.environ['VERSION']
          data = {
            'addons': {
              'booknote-offline@local': {
                'updates': [{
                  'version': version,
                  'update_link': f'https://github.com/gooidtto/BookNote-Offline/releases/download/v{version}/BookNote-Offline-v{version}.xpi'
                }]
              }
            }
          }
          with open('updates.json', 'w', encoding='utf-8') as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write('\n')
          PY
          git fetch origin release/p0-update-channel:refs/remotes/origin/release/p0-update-channel
          git checkout -B release/p0-update-channel origin/release/p0-update-channel
          mkdir -p updates
          cp "$GITHUB_WORKSPACE/updates.json" updates/updates.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add updates/updates.json
          git diff --cached --quiet || git commit -m "chore: update Firefox update channel to v${VERSION}"
          git push origin HEAD:release/p0-update-channel
